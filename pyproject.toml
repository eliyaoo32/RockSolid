# Tool settings only. Dependencies live in 3rdparty/python/requirements.txt.

[tool.ruff]
line-length = 100
# Where our own code lives, so imports from it are grouped as first-party.
src = ["src/backend", "src/generated/python", "src/tests"]
target-version = "py314"
# Generated code is regenerated, never formatted or linted.
extend-exclude = ["src/generated"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# Pants lints a subset of the files at a time, so Ruff cannot always find our packages on disk.
known-first-party = ["conversations", "deployables", "e2e", "executables", "libs", "modules", "users"]

[tool.ruff.lint.pep8-naming]
# odata-query's visitor calls each method by its node's class name, such as visit_Identifier.
extend-ignore-names = ["visit_*"]

[tool.pyright]
typeCheckingMode = "strict"
# Generated code is checked by its generator, not by us.
ignore = ["src/generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
# Generated code is exempt. Deployable entry points only wire and start the process.
omit = ["src/generated/*", "src/backend/deployables/*"]

[tool.coverage.report]
omit = ["src/generated/*", "src/backend/deployables/*"]

