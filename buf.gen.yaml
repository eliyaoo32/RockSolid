# Contracts live in src/protos; each language's generated code lives in src/generated/<language>.
# Plugin versions match the connectrpc and protobuf-py runtime versions in the lockfile.
version: v2
plugins:
  - remote: buf.build/bufbuild/py:v0.6.0
    out: src/generated/python
    # Also generates the buf.validate rules our contracts import, imported as `buf.validate`
    # rather than relatively, since each contract is its own top-level package.
    include_imports: true
    opt: map_imports=buf/validate/:.
  - remote: buf.build/connectrpc/py:v0.12.1
    out: src/generated/python
  # Generates messages and service descriptors that Connect clients use; the version matches @bufbuild/protobuf.
  - remote: buf.build/bufbuild/es:v2.16.0
    out: src/generated/typescript
    # Generated code is checked by its generator, not by us: buf.validate's enums are not the
    # erasable syntax our TypeScript allows.
    opt:
      - target=ts
      - ts_nocheck=true
    include_imports: true
