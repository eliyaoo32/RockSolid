[GLOBAL]
pants_version = "2.33.1"
backend_packages = [
  "pants.backend.python",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.python.typecheck.pyright",
  "pants.backend.build_files.fmt.ruff",
  "pants.backend.docker",
  "pants.backend.experimental.visibility",
]
# The frontend build for E2E tests is not committed, yet the tests depend on it.
pants_ignore.add = ["!/src/tests/e2e/frontend-build/"]
# `make dev` keeps one Pants running to restart the backend; other Pants commands still run.
concurrent = true

[source]
# Imports start at src/backend/ (`modules.clients.domain.client`). Generated Python is its own
# root, so it imports by proto package (`clients.v1`), and so are the tests across the system
# (`e2e.framework.system`).
root_patterns = ["/src/backend", "/src/generated/python", "/src/tests"]

[python]
interpreter_constraints = ["CPython==3.14.*"]
enable_resolves = true

[generate-lockfiles]
diff = true

[test]
use_coverage = true

[coverage-py]
global_report = true
fail_under = 100

[cli.alias]
verify = "tailor --check update-build-files --check lint check test"

[pytest]
# One pytest version, shared by the tests and by Pyright's view of them.
install_from_resolve = "python-default"
# Only pytest itself; each test gets the rest through its own dependencies.
requirements = [
  "//3rdparty/python#pytest",
  "//3rdparty/python#pytest-asyncio",
  "//3rdparty/python#pytest-cov",
]

[update-build-files]
formatter = "ruff"
