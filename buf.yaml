version: v2
modules:
  - path: src/protos
# protovalidate: the `buf.validate` field rules that every request is checked against.
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # By the owner's decision, for the one pull request that moves the clients example out of
  # src/protos. The next pull request removes it, so no project inherits it.
  ignore:
    - src/protos/clients
